[package]
name = "webcodex-desktop"
version = "0.4.1"
description = "CodexLink desktop application"
edition = "2021"
publish = false

# Keep Tauri/WebView dependencies out of the root WebCodex Cargo workspace.
[workspace]

[lib]
name = "webcodex_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
webcodex-process = { path = "../../../crates/webcodex-process" }
webcodex-runner-config = { path = "../../../crates/webcodex-runner-config" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem"] }
winreg = "0.55"

[dev-dependencies]
tempfile = "3"

